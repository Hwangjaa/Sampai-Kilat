<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SampaiKilat - Masuk</title>
    <link rel="stylesheet" href="../../css/login/login.css">
</head>
<body>
    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="../../assets/loginpage/video/FINAL CUT.mp4" type="video/mp4">
            Browser Anda tidak mendukung video HTML5.
        </video>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <form action="../../controller/login/logincontroller.php" method="post" autocomplete="on">
            <div class="form-group">
                <label for="username"><b>Username</b></label>
                <input type="text" id="username" name="username" autocomplete="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label for="password"><b>Password</b></label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Masukkan password" required>
            </div>
            <button type="submit">MASUK</button>
        </form>
    </div>
</body>
</html>
